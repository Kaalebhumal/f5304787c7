<body>
<div id="app">
  <aside id="rail" aria-label="Course navigation">
    <div class="rail-head">
      <h1 class="wordmark" id="wordmark">The Marketing Semester<span class="sub">16 weeks · 80 lectures</span></h1>
      <button class="course-switch" id="courseSwitch" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h11M4 12h16M4 17h8"/></svg>
        Change course

    </div>
    <nav id="syllabus"></nav>
  </aside>

      <button class="icon-btn" id="railToggle" aria-label="Open course navigation">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
